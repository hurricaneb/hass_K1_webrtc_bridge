name: "Creality K1 WebRTC Camera Bridge"
slug: "creality_webrtc_bridge"
version: "1.6.0"
description: "WebRTC camera bridge for Creality K1 / K1 Max (new firmware) to Home Assistant MJPEG stream"
url: "https://github.com/hurricaneb/hass_K1_webrtc_bridge"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: services
boot: auto
init: false
host_network: true
options:
  printer_ip: "192.168.10.161"
  printer_port: 8000
  stream_port: 8080
  target_fps: 15
  jpeg_quality: 80
  log_level: "info"
schema:
  printer_ip: str
  printer_port: int
  stream_port: int
  target_fps: int
  jpeg_quality: int
  log_level: match(trace|debug|info|warning|error)
